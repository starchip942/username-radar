name: Update site list
on:
  schedule:
    - cron: '17 3 * * 1' # every Monday
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download the four source lists
        run: |
          mkdir -p /tmp/src
          curl -fsSL https://raw.githubusercontent.com/sherlock-project/sherlock/master/sherlock_project/resources/data.json -o /tmp/src/sherlock.json
          curl -fsSL https://raw.githubusercontent.com/soxoj/maigret/main/maigret/resources/data.json -o /tmp/src/maigret.json
          curl -fsSL https://raw.githubusercontent.com/WebBreacher/WhatsMyName/main/wmn-data.json -o /tmp/src/wmn.json
          curl -fsSL https://raw.githubusercontent.com/starchip942/social-analyzer/main/data/sites.json -o /tmp/src/sa.json
      - name: Build combined list
        run: node tools/build-sites.mjs /tmp/src/sherlock.json /tmp/src/maigret.json /tmp/src/wmn.json /tmp/src/sa.json sites.json
      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites.json
          if ! git diff --cached --quiet -- sites.json; then git commit -m "Update site list" && git push; fi
