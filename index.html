<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Username Radar</title>
  <meta name="description" content="Find a username across thousands of websites, using the combined site lists of Sherlock, Maigret, WhatsMyName and Social Analyzer.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22none%22 stroke=%22%232f5d50%22 stroke-width=%222%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222%22 fill=%22%232f5d50%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Username Radar</h1>
    </header>

    <section class="card">
      <form id="scanForm">
        <label for="usernames">Username(s)</label>
        <div class="row">
          <input id="usernames" name="usernames" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="e.g. johndoe — separate several with commas" required>
          <button type="submit" id="scanBtn">Scan</button>
          <button type="button" id="stopBtn" class="secondary" hidden>Stop</button>
        </div>

      </form>
    </section>

    <section class="card" id="progressCard" hidden>
      <p class="eta" id="eta"></p>
      <div class="progress"><div id="bar"></div></div>
      <p id="status" class="status"></p>
    </section>

    <section class="card" id="resultsCard" hidden>
      <div class="tabs" id="tabs">
        <button data-tab="found" class="active">Found <span>0</span></button>
        <button data-tab="possible">Possible <span>0</span></button>
        <button data-tab="missing">Not found <span>0</span></button>
        <button data-tab="unknown">Couldn't check <span>0</span></button>
      </div>
      <p class="hint" id="tabHint"></p>
      <ul id="results" class="results"></ul>
      <button id="moreBtn" class="secondary" hidden>Show more</button>

      <div id="linkedBox" hidden>
        <h2>Linked accounts</h2>
        <p class="hint">Links to other profiles found on the matching pages. They may use different usernames.</p>
        <ul id="linked" class="results"></ul>
      </div>

      <div class="exports">
        <button id="expMd">Download Output.markdown</button>
      </div>
    </section>

    <footer>
      Site lists from
      <a href="https://github.com/sherlock-project/sherlock">Sherlock</a> (MIT),
      <a href="https://github.com/soxoj/maigret">Maigret</a> (MIT),
      <a href="https://github.com/WebBreacher/WhatsMyName">WhatsMyName</a> (CC BY-SA 4.0) and
      <a href="https://github.com/qeeqbox/social-analyzer">Social Analyzer</a> (AGPL-3.0).
      <span id="builtAt"></span>
    </footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
